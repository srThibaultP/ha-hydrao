rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No service actions are provided by this integration.
  appropriate-polling:
    status: exempt
    comment: >
      Push integration, Home Assistant polls nothing. The shower head is only
      read while it is connected, which means during a shower.
  brands:
    status: done
    comment: Hydrao icon and logo shipped in custom_components/hydrao/brand/.
  common-modules:
    status: done
  config-flow-test-coverage:
    status: done
  config-flow:
    status: done
  dependency-transparency:
    status: done
    comment: bleak and bleak-retry-connector are provided by HA core bluetooth dependency.
  docs-actions:
    status: exempt
    comment: No service actions are provided by this integration.
  docs-conditions:
    status: exempt
    comment: No conditions are provided by this integration.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: No triggers are provided by this integration.
  entity-event-setup:
    status: exempt
    comment: >
      Entities subscribe to nothing, they only read the coordinator. The
      Bluetooth callbacks belong to the config entry and are removed with it.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: exempt
    comment: >
      The showerhead only advertises during an active shower; it is unreachable
      most of the time, so a connection test during config flow is not possible.
  test-before-setup:
    status: exempt
    comment: >
      The shower head is powered by the water and is off between showers, so
      there is nothing to test at setup. Raising ConfigEntryNotReady would
      keep the entry failing most of the time. Entities start unavailable and
      a Bluetooth callback connects at the next shower.
  unique-config-entry:
    status: done

  # Silver
  action-exceptions:
    status: exempt
    comment: >
      No service actions are provided by this integration, and the entity
      actions (button, numbers, selects) only queue a request for the next
      connection, which cannot fail. Out of range values are refused by Home
      Assistant itself.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: exempt
    comment: No configuration parameters, the shower head is found through Bluetooth discovery.
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
  parallel-updates:
    status: done
  reauthentication-flow:
    status: exempt
    comment: No authentication required for BLE communication.
  test-coverage:
    status: done

  # Gold
  devices:
    status: done
  diagnostics:
    status: done
  discovery-update-info:
    status: exempt
    comment: >
      The device is identified by its Bluetooth address, which does not
      change, and there is no network information to update.
  discovery:
    status: done
    comment: async_step_bluetooth handles the Bluetooth discovery.
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: One device per config entry; no dynamic device addition needed.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: The BLE signal and flow calibration sensors are disabled by default.
  entity-translations:
    status: done
  exception-translations:
    status: exempt
    comment: This integration does not raise exceptions of its own.
  icon-translations:
    status: done
  reconfiguration-flow:
    status: exempt
    comment: Nothing to reconfigure, the only setting is the discovered Bluetooth address.
  repair-issues:
    status: exempt
    comment: No cases requiring user intervention via repair flow.
  stale-devices:
    status: exempt
    comment: One device per entry; removed automatically when entry is removed.

  # Platinum
  async-dependency:
    status: done
    comment: bleak is fully async.
  inject-websession:
    status: exempt
    comment: No HTTP/WebSocket dependency; BLE only.
  strict-typing:
    status: done
