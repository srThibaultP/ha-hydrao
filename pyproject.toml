[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The respx plugin imports httpx before Home Assistant can alias it to httpx2
addopts = "-p no:respx"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.hydrao"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_any_generics = true
explicit_package_bases = true
files = ["custom_components/hydrao"]

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
follow_imports = "silent"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
# Long lines are left to the formatter, as in Home Assistant core
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Home Assistant declares entity and flow attributes as class variables
"custom_components/*" = ["RUF012"]

[tool.ruff.lint.isort]
# Same import order as Home Assistant core
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["homeassistant"]
